<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 480" width="1800" height="480">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A6B7C"/>
    </marker>
  </defs>
  <rect width="1800" height="480" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="60" y="48" font-family="FreeSans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2A6B7C">RAG Overview</text>
  <text x="60" y="68" font-family="FreeSans, Arial, sans-serif" font-size="13" fill="#718096">From user query to generated output in three phases</text>
  <line x1="60" y1="80" x2="1740" y2="80" stroke="#E0E0E0" stroke-width="0.5"/>
  
  <!-- Query Phase -->
  <rect x="60" y="95" width="460" height="340" rx="2" fill="#CEE5F3" opacity="0.25" stroke="#2A6B7C" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="80" y="120" font-family="FreeSans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2A6B7C">Query Phase</text>
  
  <!-- User icon + box -->
  <rect x="100" y="140" width="120" height="80" rx="2" fill="#F8F9FA" stroke="#475461" stroke-width="1"/>
  <g transform="translate(125,155)"><path d="M12,0 C5.4,0 0,5.4 0,12 c0,6.6 5.4,12 12,12 s12,-5.4 12,-12 C24,5.4 18.6,0 12,0z" fill="none" stroke="#2A6B7C" stroke-width="1.5"/><path d="M6,22 c-4,1.5 -7,5 -8,9 h32 c-1,-4 -4,-7.5 -8,-9 c-2,-1 -4,-1.5 -6,-1.5 s-4,0.5 -6,1.5 c-0.5,0 -1,0.1 -1.5,0.3" fill="none" stroke="#2A6B7C" stroke-width="1.5"/></g>
  <text x="160" y="240" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="12" fill="#2D3748">User Query</text>
  
  <!-- Embedding Model -->
  <rect x="280" y="140" width="180" height="80" rx="2" fill="#F8F9FA" stroke="#475461" stroke-width="1"/>
  <g transform="translate(295,155)"><rect x="0" y="0" width="20" height="28" rx="2" fill="none" stroke="#2A6B7C" stroke-width="1.5"/><line x1="5" y1="6" x2="15" y2="6" stroke="#2A6B7C" stroke-width="1"/><line x1="5" y1="10" x2="15" y2="10" stroke="#2A6B7C" stroke-width="1"/><line x1="5" y1="14" x2="12" y2="14" stroke="#2A6B7C" stroke-width="1"/><rect x="2" y="20" width="16" height="3" rx="1" fill="#2A6B7C"/></g>
  <text x="370" y="200" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="12" fill="#2D3748">Embedding Model</text>
  <text x="370" y="216" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="11" fill="#718096">Qwen/Qwen3-Embedding-0.6B</text>
  
  <!-- Arrow Query -> Embedding -->
  <line x1="220" y1="180" x2="280" y2="180" stroke="#2A6B7C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="172" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="10" fill="#718096">encode</text>
  
  <!-- Retrieval Phase -->
  <rect x="560" y="95" width="460" height="340" rx="2" fill="#CEE5F3" opacity="0.25" stroke="#2A6B7C" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="580" y="120" font-family="FreeSans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2A6B7C">Retrieval Phase</text>
  
  <!-- Vector Index -->
  <rect x="600" y="140" width="160" height="80" rx="2" fill="#F8F9FA" stroke="#475461" stroke-width="1"/>
  <g transform="translate(615,155)"><ellipse cx="10" cy="8" rx="10" ry="4" fill="none" stroke="#2A6B7C" stroke-width="1.5"/><path d="M0,8 v12 c0,2.2 4.5,4 10,4 c5.5,0 10,-1.8 10,-4 v-12" fill="none" stroke="#2A6B7C" stroke-width="1.5"/><path d="M0,16 v12 c0,2.2 4.5,4 10,4 c5.5,0 10,-1.8 10,-4 v-12" fill="none" stroke="#2A6B7C" stroke-width="1.5"/></g>
  <text x="680" y="200" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="12" fill="#2D3748">Vector Index</text>
  <text x="680" y="216" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="11" fill="#718096">Content + Task Vectors</text>
  
  <!-- Retriever -->
  <rect x="810" y="140" width="160" height="80" rx="2" fill="#F8F9FA" stroke="#475461" stroke-width="1"/>
  <g transform="translate(825,155)"><circle cx="10" cy="10" r="6" fill="none" stroke="#2A6B7C" stroke-width="1.5"/><line x1="15" y1="15" x2="22" y2="22" stroke="#2A6B7C" stroke-width="1.5"/><circle cx="10" cy="10" r="2" fill="#2A6B7C"/></g>
  <text x="890" y="200" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="12" fill="#2D3748">Retriever</text>
  <text x="890" y="216" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="11" fill="#718096">Find Relevant Passages</text>
  
  <!-- Arrow Embedding -> Vector Index -->
  <line x1="460" y1="180" x2="600" y2="180" stroke="#2A6B7C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="172" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="10" fill="#718096">vectors</text>
  
  <!-- Arrow Vector Index -> Retriever -->
  <line x1="760" y1="180" x2="810" y2="180" stroke="#2A6B7C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="785" y="172" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="10" fill="#718096">nearest neighbours</text>
  
  <!-- Generation Phase -->
  <rect x="1060" y="95" width="660" height="340" rx="2" fill="#CEE5F3" opacity="0.25" stroke="#2A6B7C" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1080" y="120" font-family="FreeSans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2A6B7C">Generation Phase</text>
  
  <!-- Prompt Assembly -->
  <rect x="1100" y="140" width="160" height="80" rx="2" fill="#F8F9FA" stroke="#475461" stroke-width="1"/>
  <g transform="translate(1115,155)"><rect x="0" y="0" width="24" height="28" rx="2" fill="none" stroke="#2A6B7C" stroke-width="1.5"/><line x1="4" y1="6" x2="20" y2="6" stroke="#2A6B7C" stroke-width="1"/><line x1="4" y1="10" x2="20" y2="10" stroke="#2A6B7C" stroke-width="1"/><line x1="4" y1="14" x2="16" y2="14" stroke="#2A6B7C" stroke-width="1"/><line x1="4" y1="18" x2="20" y2="18" stroke="#2A6B7C" stroke-width="1"/><line x1="4" y1="22" x2="12" y2="22" stroke="#2A6B7C" stroke-width="1"/></g>
  <text x="1180" y="200" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="12" fill="#2D3748">Prompt Assembly</text>
  
  <!-- LLM -->
  <rect x="1320" y="140" width="160" height="80" rx="2" fill="#F8F9FA" stroke="#E04556" stroke-width="1.5"/>
  <g transform="translate(1335,155)"><rect x="0" y="4" width="24" height="20" rx="3" fill="none" stroke="#E04556" stroke-width="1.5"/><circle cx="8" cy="14" r="3" fill="none" stroke="#E04556" stroke-width="1"/><circle cx="16" cy="14" r="3" fill="none" stroke="#E04556" stroke-width="1"/><line x1="11" y1="14" x2="13" y2="14" stroke="#E04556" stroke-width="1"/><line x1="0" y1="8" x2="4" y2="8" stroke="#E04556" stroke-width="1.5"/><line x1="0" y1="20" x2="4" y2="20" stroke="#E04556" stroke-width="1.5"/></g>
  <text x="1400" y="200" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#E04556">LLM</text>
  <text x="1400" y="216" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="11" fill="#718096">Qwen/Qwen3.6-27B</text>
  
  <!-- Output -->
  <rect x="1540" y="140" width="160" height="80" rx="2" fill="#F8F9FA" stroke="#475461" stroke-width="1"/>
  <g transform="translate(1555,155)"><rect x="0" y="0" width="28" height="20" rx="2" fill="none" stroke="#2A6B7C" stroke-width="1.5"/><line x1="0" y1="16" x2="28" y2="16" stroke="#2A6B7C" stroke-width="1.5"/><rect x="4" y="20" width="20" height="4" rx="1" fill="none" stroke="#2A6B7C" stroke-width="1"/><line x1="14" y1="20" x2="14" y2="24" stroke="#2A6B7C" stroke-width="1"/></g>
  <text x="1620" y="200" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="12" fill="#2D3748">Draft / Rewrite / Reply</text>
  
  <!-- Arrow Retriever -> Prompt -->
  <line x1="970" y1="180" x2="1100" y2="180" stroke="#2A6B7C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1035" y="172" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="10" fill="#718096">context bundle</text>
  
  <!-- Arrow Prompt -> LLM -->
  <line x1="1260" y1="180" x2="1320" y2="180" stroke="#2A6B7C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1290" y="172" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="10" fill="#718096">generate</text>
  
  <!-- Arrow LLM -> Output -->
  <line x1="1480" y1="180" x2="1540" y2="180" stroke="#2A6B7C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1510" y="172" text-anchor="middle" font-family="FreeSans, Arial, sans-serif" font-size="10" fill="#718096">output</text>
  
  <!-- Legend -->
  <rect x="60" y="400" width="40" height="3" fill="#E04556"/>
  <text x="110" y="412" font-family="FreeSans, Arial, sans-serif" font-size="11" fill="#718096">Primary generation component</text>
</svg>